<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>กำลังนำทาง... | TarmRoy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #F4F6FB;
      font-family: 'Segoe UI', sans-serif;
    }
    .box {
      text-align: center;
      padding: 40px 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      max-width: 360px; width: 90%;
    }
    .emoji { font-size: 56px; margin-bottom: 16px; }
    h2 { color: #1A3A8F; font-size: 20px; margin-bottom: 8px; }
    p  { color: #6B7280; font-size: 14px; margin-bottom: 24px; }
    .bar {
      width: 100%; height: 4px; background: #E2E8F8;
      border-radius: 99px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #1A3A8F, #3B82F6);
      border-radius: 99px;
      animation: load 1.2s ease-out forwards;
    }
    @keyframes load { to { width: 100%; } }
    .manual { margin-top: 20px; font-size: 12px; color: #9CA3AF; }
    .manual a { color: #1A3A8F; }
  </style>
</head>
<body>
  <div class="box">
    <div class="emoji">🛒</div>
    <h2>กำลังนำทางไปร้านค้า</h2>
    <p>{% if product %}{{ product.name }}{% endif %}</p>
    <div class="bar"><div class="bar-fill"></div></div>
    <div class="manual">
      ถ้าไม่ถูก redirect อัตโนมัติ
      <a href="{{ shop_url }}" rel="noreferrer">กดที่นี่</a>
    </div>
  </div>

  <script>
    // ใช้ window.location.replace แทน href เพื่อไม่ส่ง Referer header
    setTimeout(function() {
      window.location.replace("{{ shop_url|escapejs }}");
    }, 800);
  </script>
</body>
</html>
