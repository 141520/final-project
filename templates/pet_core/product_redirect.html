<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>กำลังนำทาง... | TarmRoy</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;
         background:#F4F6FB;font-family:'Segoe UI',sans-serif}
    .box{text-align:center;padding:36px 28px;background:#fff;border-radius:20px;
         box-shadow:0 4px 24px rgba(0,0,0,.08);max-width:400px;width:90%}
    .emoji{font-size:52px;margin-bottom:14px}
    h2{color:#1A3A8F;font-size:19px;margin-bottom:6px}
    .sub{color:#6B7280;font-size:13px;margin-bottom:20px}
    .bar{width:100%;height:4px;background:#E2E8F8;border-radius:99px;overflow:hidden;margin-bottom:24px}
    .bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#1A3A8F,#3B82F6);
              border-radius:99px;animation:load 1.5s ease-out forwards}
    @keyframes load{to{width:100%}}

    .btn-go{display:block;width:100%;padding:13px;background:#1A3A8F;color:#fff;
            border:none;border-radius:10px;font-size:15px;font-weight:700;
            text-decoration:none;cursor:pointer;margin-bottom:10px;transition:opacity .2s}
    .btn-go:hover{opacity:.88}
    .btn-copy{display:block;width:100%;padding:10px;background:#EEF2FB;color:#1A3A8F;
              border:1.5px solid #D0D8EE;border-radius:10px;font-size:13px;font-weight:600;
              cursor:pointer;margin-bottom:16px;transition:background .2s}
    .btn-copy:hover{background:#DBE4F5}
    .btn-copy.copied{background:#DCFCE7;border-color:#22C55E;color:#166534}

    .url-box{font-size:11px;color:#9CA3AF;word-break:break-all;
             background:#F9FAFE;border:1px solid #E2E8F8;border-radius:8px;
             padding:8px 10px;text-align:left;margin-bottom:14px;line-height:1.5}
    .hint{font-size:12px;color:#9CA3AF}
  </style>
</head>
<body>
<div class="box">
  <div class="emoji">🛒</div>
  <h2>กำลังนำทางไปร้านค้า</h2>
  <div class="sub">{% if product %}{{ product.name }}{% endif %}</div>
  <div class="bar"><div class="bar-fill"></div></div>

  <!-- ปุ่มหลัก: เปิดร้านค้า -->
  <a id="btnGo" href="{{ shop_url }}" rel="noreferrer noopener" target="_blank" class="btn-go">
    🛒 เปิดร้านค้า
  </a>

  <!-- ปุ่มสำรอง: copy URL -->
  <button class="btn-copy" id="btnCopy" onclick="copyUrl()">
    📋 คัดลอก URL ร้านค้า (ถ้าเปิดไม่ได้)
  </button>

  <div class="url-box" id="urlBox">{{ shop_url }}</div>
  <div class="hint">ถ้ากดแล้วไม่เปิด ให้คัดลอก URL แล้ววางใน browser ใหม่</div>
</div>

<script>
var SHOP_URL = "{{ shop_url|escapejs }}";

function copyUrl() {
  navigator.clipboard.writeText(SHOP_URL).then(function() {
    var btn = document.getElementById('btnCopy');
    btn.textContent = '✅ คัดลอกแล้ว!';
    btn.classList.add('copied');
    setTimeout(function(){ btn.textContent = '📋 คัดลอก URL ร้านค้า (ถ้าเปิดไม่ได้)'; btn.classList.remove('copied'); }, 2500);
  }).catch(function() {
    // fallback: select the URL box
    var box = document.getElementById('urlBox');
    var range = document.createRange();
    range.selectNode(box);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
  });
}
</script>
</body>
</html>
