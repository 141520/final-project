{% extends 'base.html' %}
{% block title %}ยืนยันการลบ | Pet Finder{% endblock %}

{% block content %}
<div style="max-width:520px;margin:60px auto;padding:0 20px;">
  <div style="background:white;border-radius:18px;padding:36px;text-align:center;
              box-shadow:0 6px 22px rgba(0,0,0,.06);">
    <div style="font-size:54px;margin-bottom:12px;">🗑️</div>
    <h2 style="font-family:'IBM Plex Sans Thai Looped',sans-serif;color:#003459;margin-bottom:10px;">
      ยืนยันการลบประกาศ
    </h2>
    <p style="color:#667479;margin-bottom:8px;">คุณต้องการลบประกาศนี้ใช่หรือไม่?</p>
    <p style="color:#003459;font-weight:700;margin-bottom:24px;">
      "{{ pet.name }}" ({{ pet.get_post_type_display }})
    </p>

    <form method="post" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      {% csrf_token %}
      <a href="{% url 'edit_post' pet.id %}"
         style="padding:11px 26px;border-radius:24px;background:#f0f2f5;color:#003459;
                text-decoration:none;font-weight:700;border:1px solid #ddd;">
        ยกเลิก
      </a>
      <button type="submit"
              style="padding:11px 26px;border-radius:24px;background:#CD0205;color:white;
                     border:none;font-weight:700;cursor:pointer;font-family:inherit;">
        🗑 ลบถาวร
      </button>
    </form>
  </div>
</div>
{% endblock %}
