{% extends 'base.html' %}
{% block title %}แผนที่สัตว์เลี้ยง | TarmRoy{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --navy:#003459;--navy-dark:#002A48;
  --cream:#FCEED5;--green:#1a7a4a;
  --red:#CD0205;--orange:#f59e0b;
}

html, body { height:100%; margin:0; padding:0; }
.map-page {
  display:flex; flex-direction:column;
  /* ใช้ dvh (dynamic viewport height) แทน vh เพื่อหลีกเลี่ยงปัญหา mobile toolbar */
  height: calc(100dvh - 72px);
  height: calc(100vh - 72px); /* fallback */
  min-height:600px;
}
.map-wrap {
  position:relative; flex:1; overflow:hidden;
  min-height:500px;
}
/* ต้องกำหนด height ให้ชัดเจน — ไม่ใช้ inset:0 เพราะ flexbox อาจคำนวณผิด */
#map {
  width:100%; height:100%;
  position:relative; z-index:1;
  background:#e8e0d4;
}

/* top bar */
.map-topbar {
  background:white; padding:10px 20px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  box-shadow:0 2px 8px rgba(0,0,0,.07); z-index:500; position:relative;
}
.map-topbar h2 {
  font-family:'IBM Plex Sans Thai Looped',sans-serif;
  font-size:18px; font-weight:700; color:var(--navy); margin-right:auto;
}
.stat-pill {
  padding:6px 14px; border-radius:20px; font-size:13px; font-weight:700;
  font-family:'IBM Plex Sans Thai Looped',sans-serif;
}
.pill-all  { background:#EEF2FF; color:var(--navy); }
.pill-lost { background:#ffeaea; color:var(--red); }
.pill-found{ background:#e8f5ee; color:var(--green); }

.filter-row { display:flex; gap:8px; }
.map-filter {
  padding:7px 16px; border-radius:20px; font-size:13px; font-weight:700;
  border:1.5px solid #ddd; background:white; cursor:pointer;
  font-family:'IBM Plex Sans Thai Looped',sans-serif; transition:all .2s;
}
.map-filter.active-all   { background:var(--navy);  color:white; border-color:var(--navy); }
.map-filter.active-lost  { background:var(--red);   color:white; border-color:var(--red); }
.map-filter.active-found { background:var(--green); color:white; border-color:var(--green); }

/* popup */
.popup-card { width:220px; font-family:'IBM Plex Sans Thai Looped',sans-serif; }
.popup-img {
  width:100%; height:130px; object-fit:cover; border-radius:8px;
  margin-bottom:8px; background:#f5f5f5;
}
.popup-badge {
  display:inline-block; padding:2px 10px; border-radius:20px;
  font-size:10px; font-weight:700; margin-bottom:4px;
}
.pb-lost  { background:#ffeaea; color:var(--red); }
.pb-found { background:#e8f5ee; color:var(--green); }
.popup-name { font-size:16px; font-weight:700; color:var(--navy); margin-bottom:4px; }
.popup-loc  { font-size:12px; color:#667479; margin-bottom:6px; }
.popup-reward {
  display:inline-flex; align-items:center; gap:4px;
  background:var(--orange); color:white;
  padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700;
  margin-bottom:8px;
}
.popup-btn {
  display:block; text-align:center; padding:8px;
  background:var(--navy); color:white; border-radius:8px;
  text-decoration:none; font-weight:700; font-size:13px;
  transition:background .2s;
}
.popup-btn:hover { background:var(--navy-dark); }

/* leaflet marker override */
.marker-lost  { background:var(--red);   }
.marker-found { background:var(--green); }

/* locate btn */
.locate-btn {
  position:absolute; bottom:30px; right:14px; z-index:1000;
  background:white; border:2px solid #ddd; border-radius:50%;
  width:40px; height:40px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.15); font-size:18px;
}

@media (max-width: 720px) {
  .map-page { height: calc(100vh - 60px); min-height: 480px; }
  .map-topbar { padding: 8px 12px; gap: 6px; }
  .map-topbar h2 { font-size: 15px; width: 100%; margin-right: 0; margin-bottom: 4px; }
  .stat-pill { padding: 4px 10px; font-size: 11px; }
  .filter-row { width: 100%; gap: 6px; }
  .map-filter {
    padding: 6px 10px; font-size: 12px; flex: 1;
  }
  .locate-btn { bottom: 20px; right: 10px; width: 44px; height: 44px; }
  .popup-card { width: 200px; }
  .popup-img { height: 110px; }
}
@media (max-width: 380px) {
  .stat-pill { font-size: 10px; padding: 4px 8px; }
}
</style>
{% endblock %}

{% block content %}
<div class="map-page">

  <div class="map-topbar">
    <h2>🗺️ แผนที่สัตว์เลี้ยง</h2>
    <span class="stat-pill pill-all">ทั้งหมด {{ total_map }} หมุด</span>
    <span class="stat-pill pill-lost">หาย {{ total_lost }}</span>
    <span class="stat-pill pill-found">พบ {{ total_found }}</span>
    <div class="filter-row">
      <button class="map-filter active-all" id="f-all"   onclick="setFilter('all')">ทั้งหมด</button>
      <button class="map-filter"            id="f-lost"  onclick="setFilter('lost')">🔍 สัตว์หาย</button>
      <button class="map-filter"            id="f-found" onclick="setFilter('found')">🐾 สัตว์พบ</button>
    </div>
  </div>

  <div class="map-wrap">
    <div id="map"></div>
    <button class="locate-btn" onclick="locateMe()" title="หาตำแหน่งฉัน">📍</button>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
const POSTS = {{ posts_json|safe }};

// ── Bounding box ของประเทศไทย (กัน fitBounds กระโดดออกนอกประเทศ) ──
const THAILAND_BOUNDS = L.latLngBounds(
  L.latLng(5.5,  97.0),   // SW corner
  L.latLng(20.5, 105.8)   // NE corner
);
const BANGKOK = [13.75, 100.5];

// ── Init map — center กรุงเทพ zoom 6, จำกัด pan ไม่ให้ออกนอก SE Asia ──
const map = L.map('map', {
  zoomControl: true,
  minZoom: 5,
  maxZoom: 19,
}).setView(BANGKOK, 6);

// ── Tile layer: CartoDB Voyager (ฟรี, ไม่ต้อง API key) ──
// ตัดสัญลักษณ์ {r} ออก — ป้องกัน retina detection ผิดพลาดในบางเบราว์เซอร์
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19,
  crossOrigin: true,
}).addTo(map);

// ── Heatmap layer ──
const heatPoints = POSTS
  .filter(p => p.lat && p.lng)
  .map(p => [p.lat, p.lng, p.post_type === 'lost' ? 1.0 : 0.6]);
const heatLayer = L.heatLayer(heatPoints, {
  radius: 26, blur: 22, minOpacity: .35,
  gradient: { 0.2:'#4E73F6', 0.5:'#F9C82F', 0.8:'#D75CA7', 1:'#CD0205' },
});

// ปุ่มสลับ heatmap
const heatBtn = L.control({ position: 'topright' });
heatBtn.onAdd = () => {
  const b = L.DomUtil.create('button');
  b.innerHTML = '🔥 Heatmap'; b.style.cssText =
    'padding:8px 14px;border:none;border-radius:8px;background:white;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);font-family:inherit;';
  b.onclick = (e) => {
    e.preventDefault(); e.stopPropagation();
    if (map.hasLayer(heatLayer)) { map.removeLayer(heatLayer); b.innerHTML = '🔥 Heatmap'; }
    else { heatLayer.addTo(map); b.innerHTML = '✓ Heatmap เปิด'; }
  };
  L.DomEvent.disableClickPropagation(b);
  return b;
};
heatBtn.addTo(map);

// ── Custom icons ──
function makeIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="
      width:28px;height:28px;border-radius:50% 50% 50% 0;
      background:${color};border:2px solid white;
      transform:rotate(-45deg);
      box-shadow:0 2px 6px rgba(0,0,0,.35);
    "></div>`,
    iconSize: [28, 28],
    iconAnchor: [14, 28],
    popupAnchor: [0, -30],
  });
}

const iconLost     = makeIcon('#CD0205');
const iconFound    = makeIcon('#1a7a4a');
const iconResolved = makeIcon('#999');

// ── Markers ──
let markers = [];
let currentFilter = 'all';

function buildPopup(p) {
  const img = p.image_url
    ? `<img src="${p.image_url}" class="popup-img" onerror="this.style.display='none'">`
    : `<div style="height:80px;background:#f5f5f5;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:8px;">🐾</div>`;
  const badgeClass = p.post_type === 'lost' ? 'pb-lost' : 'pb-found';
  const badgeText  = p.post_type === 'lost' ? '🔍 สัตว์หาย' : '🐾 สัตว์พบ';
  const resolved   = p.status === 'resolved'
    ? '<span style="background:#888;color:#fff;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;">✅ ปิดประกาศแล้ว</span>' : '';
  const reward = p.reward
    ? `<div class="popup-reward">🎁 รางวัล ฿${Number(p.reward).toLocaleString()}</div>` : '';
  const loc = p.location_name
    ? `<div class="popup-loc">📍 ${p.location_name}</div>` : '';

  return `<div class="popup-card">
    ${img}
    <span class="popup-badge ${badgeClass}">${badgeText}</span> ${resolved}
    <div class="popup-name">${p.name}</div>
    ${loc}${reward}
    <a href="${p.detail_url}" class="popup-btn">ดูรายละเอียด →</a>
  </div>`;
}

function renderMarkers(filter) {
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  POSTS.forEach(p => {
    if (!p.lat || !p.lng) return;                            // ข้ามถ้าไม่มีพิกัด
    if (filter !== 'all' && p.post_type !== filter) return;
    const icon = p.status === 'resolved'
      ? iconResolved : (p.post_type === 'lost' ? iconLost : iconFound);
    const m = L.marker([p.lat, p.lng], { icon })
      .bindPopup(buildPopup(p), { maxWidth: 240, className: 'pet-popup' });
    m.addTo(map);
    markers.push(m);
  });
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.map-filter').forEach(btn => { btn.className = 'map-filter'; });
  const cls = f === 'all' ? 'active-all' : f === 'lost' ? 'active-lost' : 'active-found';
  document.getElementById('f-' + f).classList.add(cls);
  renderMarkers(f);
}

function locateMe() {
  if (!navigator.geolocation) return alert('เบราว์เซอร์ไม่รองรับ GPS');
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lng } = pos.coords;
    map.setView([lat, lng], 14);
    L.circle([lat, lng], { radius: 500, color: '#003459', fillOpacity: .15 }).addTo(map);
    L.marker([lat, lng], { icon: makeIcon('#003459') })
      .bindPopup('📍 ตำแหน่งของคุณ').addTo(map).openPopup();
  }, () => alert('ไม่สามารถดึงตำแหน่งได้'));
}

// ── Force map container to correct size BEFORE rendering tiles ──
// ใช้ requestAnimationFrame เพื่อรอให้ CSS flex layout settle ก่อน
function initMap() {
  map.invalidateSize({ animate: false });

  // วาด markers
  renderMarkers('all');

  // fitBounds เฉพาะถ้า markers อยู่ในไทย — ไม่กระโดดไปอินเดีย
  if (markers.length > 0) {
    const group = L.featureGroup(markers);
    const bounds = group.getBounds();
    if (THAILAND_BOUNDS.contains(bounds.getCenter())) {
      // markers อยู่ในไทย — zoom เข้าหา
      map.fitBounds(bounds.pad(0.15), { maxZoom: 13 });
    } else {
      // coordinates ผิดหรืออยู่นอกไทย — ล็อกที่กรุงเทพ
      map.setView(BANGKOK, 6);
    }
  } else {
    map.setView(BANGKOK, 6);
  }
}

// รอให้ DOM + CSS layout เสร็จก่อน init
if (document.readyState === 'complete') {
  requestAnimationFrame(() => requestAnimationFrame(initMap));
} else {
  window.addEventListener('load', () => requestAnimationFrame(() => requestAnimationFrame(initMap)));
}

// Fallback invalidateSize หลัง 500ms (กรณี font / transition ทำให้ layout ช้า)
setTimeout(() => map.invalidateSize({ animate: false }), 500);
</script>
{% endblock %}
