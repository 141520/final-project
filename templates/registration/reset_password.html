<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#FCEED5">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
    <title>ตั้งรหัสผ่านใหม่ | TarmRoy</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;700&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: linear-gradient(134deg, #FCEED5 6%, #FFE7BA 100%); min-height: 100vh; display: flex; flex-direction: column; font-family: 'Poppins','IBM Plex Sans Thai Looped',sans-serif; -webkit-font-smoothing: antialiased; }
        header { padding: 22px 48px; }
        .logo { color: #021F74; font-size: 38px; font-family: 'Caveat',cursive; text-decoration: none; }
        .wrap { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: white; width: 100%; max-width: 480px; border-radius: 20px; padding: 38px 44px; box-shadow: 0 10px 30px rgba(0,0,0,.1); }
        h1 { color: #021F74; font-size: 32px; margin-bottom: 6px; }
        .underline { width: 130px; height: 6px; background: linear-gradient(90deg,#756EF5,#D75CA7,#F9C82F); border-radius: 4px; margin-bottom: 22px; }
        p.lead { font-size: 14px; color: #555; margin-bottom: 18px; line-height: 1.5; }
        .form-input { width: 100%; height: 54px; border-radius: 14px; border: 2px solid #BEBEBE; padding: 0 20px; font-size: 16px; outline: none; margin-bottom: 14px; transition: .2s; font-family: inherit; }
        .form-input:focus { border-color: #4E73F6; box-shadow: 0 0 0 4px rgba(78,115,246,.12); }
        .btn {
            width: 100%; height: 54px; border-radius: 14px; border: none;
            background: #4E73F6; color: white; font-weight: 700; font-size: 16px;
            cursor: pointer; box-shadow: 0 6px 18px rgba(78,115,246,.3);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: .2s; font-family: inherit;
        }
        .btn:hover:not(:disabled) { background: #3b5bdb; transform: translateY(-2px); }
        .btn:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; transform: none; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2.5px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #msgBox { font-size: 14px; padding: 11px 14px; border-radius: 10px; margin-bottom: 14px; display: none; }
        #msgBox.error { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; }
        #msgBox.success { color: #065f46; background: #ecfdf5; border: 1px solid #a7f3d0; }
        #msgBox.info { color: #1e40af; background: #eff6ff; border: 1px solid #bfdbfe; }
        .pw-meter { display: flex; gap: 4px; margin: -8px 0 14px; }
        .pw-meter span { flex: 1; height: 4px; background: #e5e7eb; border-radius: 2px; transition: .25s; }
        .pw-meter span.weak { background: #ef4444; }
        .pw-meter span.mid  { background: #f59e0b; }
        .pw-meter span.strong { background: #10b981; }
        .back-row { text-align: center; margin-top: 16px; font-size: 13px; }
        .back-row a { color: #4E73F6; text-decoration: none; font-weight: 600; }
        @media (max-width: 480px) {
            header { padding: 16px 18px; }
            .card { padding: 26px 20px; border-radius: 16px; }
            h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <header><a href="{% url 'home' %}" class="logo">TarmRoy</a></header>
    <div class="wrap">
        <div class="card">
            <h1>ตั้งรหัสผ่านใหม่</h1>
            <div class="underline"></div>

            <div id="msgBox"></div>

            <div id="loadingState" style="text-align:center;padding:30px 0;">
                <span class="spinner" style="border-color:rgba(0,0,0,.15);border-top-color:#4E73F6;"></span>
                <p style="color:#667479;margin-top:10px;font-size:14px;">กำลังตรวจสอบลิงก์...</p>
            </div>

            <div id="formState" style="display:none;">
                <p class="lead">กรอกรหัสผ่านใหม่ที่ต้องการใช้ (อย่างน้อย 6 ตัวอักษร)</p>
                <form id="resetForm">
                    <input type="password" id="newPw" class="form-input" placeholder="รหัสผ่านใหม่" minlength="6" required autocomplete="new-password">
                    <div class="pw-meter"><span></span><span></span><span></span><span></span></div>
                    <input type="password" id="confirmPw" class="form-input" placeholder="ยืนยันรหัสผ่านอีกครั้ง" minlength="6" required autocomplete="new-password">
                    <button type="submit" id="btnReset" class="btn">🔒 บันทึกรหัสผ่านใหม่</button>
                </form>
            </div>

            <div id="errorState" style="display:none;text-align:center;padding:20px 0;">
                <div style="font-size:48px;margin-bottom:8px;">⚠️</div>
                <p style="color:#555;margin-bottom:18px;">ลิงก์นี้ไม่ถูกต้องหรือหมดอายุ<br>กรุณาขอลิงก์ใหม่</p>
                <a href="{% url 'login' %}" class="btn" style="text-decoration:none;">← กลับหน้าเข้าสู่ระบบ</a>
            </div>

            <div class="back-row" id="backRow">
                <a href="{% url 'login' %}">← กลับหน้าเข้าสู่ระบบ</a>
            </div>
        </div>
    </div>

    <script>
    (function(){
        const SUPABASE_URL = '{{ SUPABASE_URL }}';
        const SUPABASE_KEY = '{{ SUPABASE_ANON_KEY }}';
        if (typeof window.mySupabaseClient === 'undefined') {
            window.mySupabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
        const sb = window.mySupabaseClient;

        const msgBox = document.getElementById('msgBox');
        function showMsg(text, type='info') {
            msgBox.className = type;
            msgBox.innerText = text;
            msgBox.style.display = 'block';
        }

        // ตรวจ session — Supabase แนบ token มาทาง URL hash หลังคลิกลิงก์ในอีเมล
        async function init() {
            // รอให้ supabase parse hash อัตโนมัติ
            await new Promise(r => setTimeout(r, 400));
            const { data: { session } } = await sb.auth.getSession();
            document.getElementById('loadingState').style.display = 'none';
            if (session) {
                document.getElementById('formState').style.display = 'block';
            } else {
                document.getElementById('errorState').style.display = 'block';
                document.getElementById('backRow').style.display = 'none';
            }
        }
        init();

        // password strength meter
        const meter = document.querySelectorAll('.pw-meter span');
        document.getElementById('newPw').addEventListener('input', e => {
            const v = e.target.value;
            let score = 0;
            if (v.length >= 6) score++;
            if (v.length >= 10) score++;
            if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
            if (/\d/.test(v) && /[^A-Za-z0-9]/.test(v)) score++;
            meter.forEach((s, i) => {
                s.className = '';
                if (i < score) s.classList.add(score <= 1 ? 'weak' : score <= 2 ? 'mid' : 'strong');
            });
        });

        document.getElementById('resetForm').addEventListener('submit', async e => {
            e.preventDefault();
            const btn = document.getElementById('btnReset');
            const newPw = document.getElementById('newPw').value;
            const confirmPw = document.getElementById('confirmPw').value;
            if (newPw !== confirmPw) return showMsg('รหัสผ่านทั้งสองช่องไม่ตรงกัน', 'error');
            if (newPw.length < 6) return showMsg('รหัสผ่านต้องมีอย่างน้อย 6 ตัว', 'error');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> กำลังบันทึก...';

            const { error } = await sb.auth.updateUser({ password: newPw });
            if (error) {
                showMsg('บันทึกไม่สำเร็จ: ' + error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '🔒 บันทึกรหัสผ่านใหม่';
            } else {
                showMsg('✅ ตั้งรหัสผ่านใหม่สำเร็จ! กำลังพาไปหน้าแรก...', 'success');
                document.getElementById('resetForm').style.display = 'none';
                setTimeout(() => { window.location.href = '/'; }, 1800);
            }
        });
    })();
    </script>
</body>
</html>
