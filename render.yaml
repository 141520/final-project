# Render Blueprint — auto-deploy เมื่อ push GitHub
services:
  - type: web
    name: petfinder
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    # --preload: โหลด PyTorch model ใน master ครั้งเดียว → fork workers ใช้ CoW memory
    # --threads 4: รับ request พร้อมกัน 4 ตัว (เพิ่ม throughput เมื่อ I/O เยอะ เช่น Supabase upload)
    # --max-requests + jitter: รีไซเคิล worker กัน memory leak ระยะยาว
    startCommand: "gunicorn petfinder_site.wsgi:application --workers 1 --threads 4 --timeout 120 --preload --max-requests 800 --max-requests-jitter 100"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      # ตั้ง 4 ตัวข้างล่างเองใน Render Dashboard (Environment tab)
      # - SUPABASE_URL
      # - SUPABASE_ANON_KEY
      # - SUPABASE_SERVICE_KEY
      # - DATABASE_URL  (จาก Supabase → Settings → Database → Connection string)
